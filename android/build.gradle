// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 35
        versionCode = 33
        versionName = "1.4.3"

        // We use NDK 23 which has both M1 support and is the side-by-side NDK version from AGP.
        ndkVersion = "26.1.10909125"
        kotlinVersion = "1.9.22"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.7.3")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

// Force androidx.core to a version compatible with compileSdk 35 + AGP 8.7.3.
// Some transitive dependencies (e.g. via react-native-screens, safe-area-context)
// pull androidx.core:1.17.0 which requires compileSdk 36 + AGP 8.9.1.
allprojects {
    configurations.all {
        resolutionStrategy {
            force 'androidx.core:core:1.15.0'
            force 'androidx.core:core-ktx:1.15.0'
            // RN 0.76+: SoLoader 0.12+ necessário para OpenSourceMergedSoMapping (libreact_featureflagsjni.so merged)
            force "com.facebook.soloader:soloader:0.12.0"
        }
    }
}
